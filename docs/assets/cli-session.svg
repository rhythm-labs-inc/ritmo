<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556" role="img" aria-label="Actual CLI fixture output: a passing metadata check followed by an intentional missing-annotations failure"><rect width="1200" height="556" rx="22" fill="#132720"/><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19"><text x="38" y="58" fill="#78dfb7">RITMO  /  LOCAL MCP CHECKS</text><text x="38" y="87" fill="#e0eae5"></text><text x="38" y="116" fill="#9cbbe3">$ ritmo mcp --server "$MCP_URL" --list-tools</text><text x="38" y="145" fill="#e0eae5">  1 › list_notes                                                 READ · WIDGET</text><text x="38" y="174" fill="#e0eae5">   Read the synthetic example notes. This only retrieves local fixture data and makes no changes.</text><text x="38" y="203" fill="#e0eae5"></text><text x="38" y="232" fill="#9cbbe3">$ ritmo validate --server "$MCP_URL" --host mcp-apps --no-probe --json</text><text x="38" y="261" fill="#e0eae5">Passing fixture: 24 pass · 1 warn · 0 fail</text><text x="38" y="290" fill="#e0eae5">exit 0</text><text x="38" y="319" fill="#e0eae5"></text><text x="38" y="348" fill="#9cbbe3">$ # Restart example with --broken; repeat validation</text><text x="38" y="377" fill="#ffae9f">directory/title-and-hints  [fail]</text><text x="38" y="406" fill="#e0eae5">no applicable hint (readOnlyHint: true for read tools, destructiveHint for write tools)</text><text x="38" y="435" fill="#ffae9f">exit 1</text><text x="38" y="464" fill="#e0eae5"></text><text x="38" y="493" fill="#e0eae5">Synthetic example · 0 model calls · actual-host acceptance not tested</text></g></svg>